[project]
authors = [{name = "Matteo Lepur", email = "lepurmatteo@gmail.com"}]
dependencies = []
name = "cfclone"
requires-python = ">= 3.11"
version = "0.1.0"
scripts = { cfclone = "cfclone.cli:main" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
platforms = ["linux-64"]
channels = ["conda-forge"]

[tool.pixi.dependencies]
python = ">=3.12"
arviz = "0.23.4.*"
click = ">=8.0"
cxx-compiler = "*"
h5py = "*"
juliaup = "*"
make = "*"
networkx = "*"
numpy = "*"
pandas = "*"
pyyaml = "*"
pyjuliacall = ">=0.9.22"
pyjuliapkg = "*"
tbb-devel = "*"
scipy = "*"
scikit-bio = "*"
pylint = ">=4.0.6,<5"

[tool.pixi.pypi-dependencies]
cfclone = { path = ".", editable = true }

[tool.pixi.tasks]
start = "cfclone"
fmt = "ruff check"
lint = "pylint"

[tool.pixi.feature.test.tasks]
test = "pytest -s"

[tool.pixi.environments]
test = ["test"]

[tool.pixi.feature.test.dependencies]
pytest = "*"