[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cfClone"
version = "0.1"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload", "Development Status :: 4 - Beta", "Programming Language :: Python :: 3.12"]

[tool.black]
line-length = 120

[project.scripts]
cfclone = "cfclone.cli:main"

[tool.setuptools.packages.find]
exclude = ["sandbox"]

[tool.setuptools.package-data]
"cfclone.julia" = ["*.jl"]
"cfclone.stan" = ["*.stan"]
"cfclone" = ["*.json"]
